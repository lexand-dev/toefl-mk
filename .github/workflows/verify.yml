name: Verify MVP

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toefl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toefl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/toefl
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-test-secret-with-at-least-32-random-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
